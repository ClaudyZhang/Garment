<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>极净奢护 · CLARITY</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  .hero { text-align: center; padding: 60px 20px 40px; }
  .hero h1 { font-size: 32px; font-weight: 200; letter-spacing: 12px; color: var(--earth); }
  .hero p { font-size: 14px; color: var(--text-muted); margin-top: 12px; letter-spacing: 2px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 480px; margin: 0 auto; }
  .action-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 20px;
    text-align: center;
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }
  .action-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(61, 50, 43, 0.12); }
  .action-card .icon { font-size: 40px; margin-bottom: 12px; }
  .action-card .title { font-size: 16px; font-weight: 500; color: var(--earth); margin-bottom: 6px; }
  .action-card .desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .action-card.sage .title { color: var(--sage); }
  .action-card.sage { border-color: var(--sage-light); }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 500px; margin: 24px auto; }
  .feature { text-align: center; padding: 16px 8px; }
  .feature .icon { font-size: 24px; margin-bottom: 6px; }
  .feature .title { font-size: 13px; font-weight: 500; color: var(--text); }
  .feature .desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">CLARITY</div>
  <div class="nav-links">
    <a href="/dashboard">后台</a>
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1>极净奢护</h1>
    <p>CLARITY LUXURY GARMENT CARE</p>
  </div>

  <div class="actions">
    <a href="/intake" class="action-card">
      <div class="icon">📥</div>
      <div class="title">收衣录入</div>
      <div class="desc">拍照识别 · AI估价<br>生成报告 · 短信确认</div>
    </a>
    <a href="/delivery" class="action-card sage">
      <div class="icon">📤</div>
      <div class="title">交衣交付</div>
      <div class="desc">洗后检测 · 前后对比<br>交衣报告 · 品质证明</div>
    </a>
  </div>

  <div class="features">
    <div class="feature">
      <div class="icon">🔍</div>
      <div class="title">AI智能识别</div>
      <div class="desc">品牌·材质·品类</div>
    </div>
    <div class="feature">
      <div class="icon">💰</div>
      <div class="title">市场估价</div>
      <div class="desc">多维度综合评估</div>
    </div>
    <div class="feature">
      <div class="icon">📋</div>
      <div class="title">专业报告</div>
      <div class="desc">收衣·交衣可追溯</div>
    </div>
  </div>
</div>

</body>
</html>
